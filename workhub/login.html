<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d30"><title>登录 · 郭爸工作中枢</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f1f3ee;color:#17231d;font-family:Arial,"PingFang SC";display:grid;place-items:center}.card{width:min(410px,calc(100% - 30px));background:#fff;border-radius:22px;padding:32px;box-shadow:0 20px 70px #183b2c20;border-top:7px solid #173d30}.mark{width:58px;height:58px;border-radius:15px;background:#173d30;color:#e0c47d;display:grid;place-items:center;font:700 34px Georgia;margin-bottom:25px}small{color:#567264;letter-spacing:.14em;font-weight:700}h1{font:600 28px Georgia,"Songti SC";margin:9px 0 7px}p{font-size:12px;color:#7b837e;line-height:1.6;margin-bottom:24px}input{width:100%;border:1px solid #d7ddd8;border-radius:11px;padding:13px;margin-bottom:10px;font-size:16px;outline:0}input:focus{border-color:#286047;box-shadow:0 0 0 3px #28604712}button{width:100%;border:0;border-radius:11px;background:#173d30;color:#fff;padding:13px;font-weight:700}#msg{color:#a34036;margin:12px 0 0}</style></head><body><form class="card" id="login"><div class="mark">郭</div><small>INTERNAL WORK HUB</small><h1>郭爸团队工作中枢</h1><p>仅供郭建伟与刘幼内部使用。请输入公司统一访问密码。</p><input id="password" type="password" autocomplete="current-password" placeholder="访问密码" required><button>进入工作中枢</button><p id="msg"></p></form><script>login.onsubmit=async e=>{e.preventDefault();msg.textContent="正在验证…";const r=await fetch("/api/workhub/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:password.value})});if(r.ok)location.href="/workhub/";else msg.textContent="密码不正确，请重新输入。"}</script></body></html>
